[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyrateshop"
version = "0.1.0"
description = "Async fan-out/lazy-load orchestration for aggregating results from multiple slow or unreliable backends without blocking on the slowest one."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miles Hernandez" }]
keywords = ["async", "fan-out", "concurrency", "streaming", "sse", "rate-shopping", "microservices"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: AsyncIO",
]
dependencies = []

[project.optional-dependencies]
examples = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.6", "httpx>=0.27.2", "python-dotenv>=1.0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27.2"]

[project.urls]
Homepage = "https://github.com/mhwebdevelopment/lazyrateshop"
Issues = "https://github.com/mhwebdevelopment/lazyrateshop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
